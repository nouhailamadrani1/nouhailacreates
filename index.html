const E_N='<circle cx="88" cy="82" r="3.2" fill="#2a1a1f"/><circle cx="112" cy="82" r="3.2" fill="#2a1a1f"/>',E_H='<path d="M83 83Q88 77 93 83M107 83Q112 77 117 83" stroke="#2a1a1f" stroke-width="3" fill="none" stroke-linecap="round"/>',E_D='<path d="M83 81Q88 86 93 81M107 81Q112 86 117 81" stroke="#2a1a1f" stroke-width="3" fill="none" stroke-linecap="round"/>',M_S='<path d="M92 98Q100 106 108 98" stroke="#c2185b" stroke-width="3" fill="none" stroke-linecap="round"/>',M_B='<path d="M90 96Q100 113 110 96Z" fill="#c2185b"/>',M_O='<circle cx="100" cy="100" r="3" fill="#c2185b"/>';

const steps=()=>{const s=[["Choisis ton design","Choose your design","اختاري تصميمك"],["Prépare ton matériel","Prepare your materials","جهزي عتادك"],["Commence à poinçonner","Start punching","ابدئي الوخز"],["Savoure ta création","Enjoy your creation","استمتعي بإبداعك"]];return `<div class="steps">${s.map((a,i)=>`<div>${scene(i,X(a))}<b>${i+1}</b><br>${X(a)}</div>`).join("")}</div>`};

const custom=()=>`<section><p class="note">${tr("ton idée, ta création","your idea, your creation","فكرتك، إبداعك")}</p><h2>${t("c2")}</h2><p>${tr("Un miroir, un sac, un accessoire ? Dis-moi ce que tu imagines (couleurs, forme, motif) et on en parle sur WhatsApp.","A mirror, a bag, an accessory? Tell me what you imagine (colours, shape, pattern) and we'll talk on WhatsApp.","مرآة، حقيبة، إكسسوار؟ قولي لي ما تتخيلين (ألوان، شكل، نقش) ونتحدث عبر واتساب.")}</p><a class="btn g" target="_blank" rel="noopener" href="${wl(CM())}">${tr("Parler de mon idée","Talk about my idea","أخبريني بفكرتك")}</a></section>`;
const REV=[
[["Après un premier essai raté où mon tissu s'est déchiré, j'ai réussi le deuxième. Je suis contente du résultat et je vais continuer à progresser.","After a first failed try where my fabric tore, I succeeded on the second. I'm happy with the result and I'll keep improving.","من بعد المحاولة الأولى لي مكانتش موفقة وتقطع ليا التوب قدرت نصايب هادي فالمحاولة التانية وأنا راضية على هاد النتيجة وان شاء الله نزيد نطور اكثر"],["Cliente","Customer","زبونة"]],
[["J'ai bien reçu le coffret. Tout est beau et rangé avec art. Je l'ai adoré, merci beaucoup.","I received the box. Everything is beautiful and arranged with art. I loved it, thank you so much.","راني توصلت بالكمونض كل شي زوين كل شي مقاد بطريقة فنة حبيتو بالجهد شكرا ليك والله اسهل عليك"],["Cliente","Customer","زبونة"]],
[["Merci à @nouhailacreates qui m'a envoyé ce pack et m'a donné une formation avec amour et patience. Ce n'est que le début, Smile Store va grandir inshallah.","Thank you to @nouhailacreates who sent me this pack and gave me training with love and patience. This is only the beginning, Smile Store will grow inshallah.","شكراً بزاف للأخت @nouhailacreates لي صرداتلي هاد الباك وعطاتني دورة تكوينية بكل حب وصبر. هاد غير البداية... وSmile Store غادي تكبر إن شاء الله"],["smile.by.soso (Smile Store), sur Instagram","smile.by.soso (Smile Store), on Instagram","smile.by.soso (Smile Store)، على إنستغرام"]],
[["Prenez ce pack, il est génial ! Je l'ai pris, il m'a beaucoup plu et j'ai appris très vite.","Get this pack, it's great! I took it, loved it, and learned very quickly.","خدوا هاد الباك واعر بزاف انا خديت الحمد لله عجبني بزاف وتعلمت بزربة"],["Cliente, commentaire Instagram","Customer, Instagram comment","زبونة، تعليق على إنستغرام"]],
[["Merci beaucoup, il m'a beaucoup plu, j'ai hâte d'essayer.","Thank you so much, I loved it, I can't wait to try.","شكرا بزااف ختي نهيلة، عجبني بزاف هادشي، متحمسة باش نجرب"],["Cliente","Customer","زبونة"]],
[["La commande est arrivée ce matin, elle l'a adorée, et le petit mot que tu lui as écrit lui a fait très plaisir.","The order arrived this morning, she loved it, and the little note you wrote her made her very happy.","وصلات ختي الكوموند هاد الصباح، عجباتها وفرحات بداك الميمو الصغير لي كتبتي ليها"],["Cliente (cadeau)","Customer (gift)","زبونة (هدية)"]]];
const revs=()=>`<section><h2>${tr("Ce que disent nos clientes","What our customers say","ماذا تقول زبوناتنا")}</h2><p class="mut">${tr("Messages réels reçus par Nouhaila Creates, traduits de l'arabe et du darija.","Real messages received by Nouhaila Creates, translated from Arabic and Darija.","رسائل حقيقية توصلت بها Nouhaila Creates.")}</p><div class="rvs">${REV.map(r=>`<blockquote class="rv"><p>« ${X(r[0])} »</p><small>${X(r[1])}</small></blockquote>`).join("")}</div><h3 style="margin-top:22px">${tr("Créations de clientes","Customer creations","إبداعات زبوناتنا")}</h3><div class="gal">${["c1","c2","c3","c4","c5","c6"].map((k,i)=>pol(k,tr("faite par une cliente","made by a customer","من إنجاز زبونة"),[-3,2,-1,3,-2,1][i])).join("")}</div></section>`;
const V={
home:()=>`<div class="gh"><div class="hcard"><div class="stk" style="top:-34px;left:-10px;background:none;border:0;transform:rotate(-10deg)">${LG(92)}</div><div class="stk" style="top:-26px;right:-8px;background:var(--yel);color:#5b2142">${tr("229 DH<br>kit standard","229 DH<br>standard kit","229 درهم<br>كيت ستاندرد")}</div><p class="note">Create your own little world.</p><h1>${t("h")}</h1><p>${t("sub")}</p><a class="btn" href="#shop">${t("c1")}</a> <a class="btn o" target="_blank" rel="noopener" href="${wl(CM())}">${t("c2")}</a></div><div class="pols">${pol("std",tr("ton premier kit","your first kit","كيتك الأول"),-5)}${pol("blue",tr("miroir fait main","handmade mirror","مرآة يدوية"),3)}${pol("bag",tr("sac brodé","embroidered bag","حقيبة مطرزة"),-2)}</div></div>
<section><p class="note">${tr("choisis ton pack","pick your pack","اختاري الباك")} ${ARW}</p><h2>${tr("Wool Box, Standard ou Pro ?","Wool Box, Standard or Pro?","Wool Box أم ستاندرد أم برو؟")}</h2><div class="why"><div>${tr("Standard : le coffret pour commencer","Standard: the box to get started","ستاندرد: الصندوق للبداية")}</div><div>${tr("Pro : l'expérience complète, pour aller plus loin","Pro: the complete experience, to go further","برو: التجربة المتكاملة للذهاب أبعد")}</div><div>${tr("Wool Box : 15 pelotes colorées seules","Wool Box: 15 coloured yarn balls only","Wool Box: 15 كبّة صوف ملونة فقط")}</div></div><br><div class="grid">${P.map(card).join("")}</div></section>
${custom()}
<section><h2>${tr("Our creative world","Our creative world","عالمنا الإبداعي")}</h2><div class="gal">${CUS.map((c,i)=>pol(c[0],X(c[1]),[-3,2,-1,4][i%4])).join("")}</div></section>
<section><h2>${tr("How Punch Needle works","How Punch Needle works","كيف يعمل البانش نيدل")}</h2>${steps()}</section>
${revs()}
<section><h2>@nouhailacreates</h2><p>${tr("Suis-nous et partage tes créations.","Follow us and share your creations.","تابعينا وشاركينا إبداعاتك.")}</p><a class="btn" target="_blank" rel="noopener" href="https://instagram.com/nouhailacreates">Instagram</a></section>`,
shop:()=>`<section><h1>${tr("Nos packs","Our packs","الباكات")}</h1><div class="grid">${P.map(card).join("")}</div></section>${custom()}`,
learn:()=>`<section><h1>${tr("Learn Punch Needle","Learn Punch Needle","تعلمي البانش نيدل")}</h1><img style="width:100%;max-width:420px;border-radius:28px" src="${IM.flower}" alt="Punch Needle"><h3>${tr("C'est quoi ?","What is it?","ما هو؟")}</h3><p>${tr("Une technique où l'on pousse du fil à travers un tissu tendu avec une aiguille creuse pour créer des boucles douces : miroirs, sacs, tapis, déco.","A technique where yarn is pushed through stretched fabric with a hollow needle to create soft loops: mirrors, bags, rugs, decor.","تقنية ندفع فيها الخيط عبر قماش مشدود بإبرة مجوفة لصنع حلقات ناعمة: مرايا، حقائب، زرابي، ديكور.")}</p><h3>${tr("Pour débutantes ?","For beginners?","للمبتدئات؟")}</h3><p>${tr("Oui. On commence par un petit motif, à ton rythme.","Yes. You start with a small motif, at your own pace.","نعم. نبدأ بنقش صغير وبإيقاعك.")}</p><h3>${tr("Pourquoi c'est relaxant ?","Why is it relaxing?","لماذا هو مريح؟")}</h3><p>${tr("Le geste est simple et répétitif : la joie est dans le processus, pas seulement dans le résultat.","The gesture is simple and repetitive: the joy is in the process, not only in the result.","الحركة بسيطة ومتكررة: المتعة في الطريق وليس في النتيجة فقط.")}</p></section>${steps()}`,
story:()=>`<div class="gh"><div class="hcard"><p class="note">${tr("notre histoire","our story","قصتنا")}</p><h1>${tr("Chaque point raconte une histoire.","Every stitch tells a story.","كل غرزة تحكي حكاية.")}</h1></div></div><section><div class="pd"><figure class="pol" style="--r:-3deg;width:100%;max-width:340px;margin:0 auto"><div style="background:var(--pink)"><img src="${IM.me}" style="mix-blend-mode:multiply;aspect-ratio:1;object-position:50% 18%" alt="Nouhaila"></div><figcaption>Nouhaila</figcaption></figure><div><h2>Nouhaila Creates</h2><p>${tr("Nouhaila Creates est née d'une passion pour l'art fait main, les couleurs et les textures.","Nouhaila Creates was born from a passion for handmade art, colours and textures.","وُلدت Nouhaila Creates من شغف بالفن اليدوي والألوان والملمس.")}</p><p>${tr("Ici, on ne vend pas seulement du matériel : on t'offre une nouvelle activité, un moment pour toi et la fierté de créer de tes mains.","Here we don't just sell materials: we offer you a new hobby, a moment for yourself and the pride of creating with your own hands.","هنا لا نبيع العتاد فقط: نقدم لك هواية جديدة، لحظة لنفسك، والفخر بالإبداع بيديك.")}</p><p>${tr("Tu n'as pas besoin d'être artiste pour faire quelque chose de beau.","You don't need to be an artist to make something beautiful.","لا تحتاجين أن تكوني فنانة لتصنعي شيئا جميلا.")}</p><p class="note">Nouhaila, complète ici ta vraie histoire.</p></div></div></section>`,
faq:()=>{const F=[[["Le Punch Needle convient-il aux débutantes ?","Is Punch Needle suitable for beginners?","هل البانش نيدل مناسب للمبتدئات؟"],["Oui, le kit Standard est pensé pour commencer.","Yes, the Standard kit is designed for getting started.","نعم، كيت ستاندرد مصمم للبداية."]],[["Quelle est la différence entre Wool Box, Standard et Pro ?","What's the difference between Wool Box, Standard and Pro?","ما الفرق بين Wool Box وستاندرد وبرو؟"],["Wool Box : pelotes de laine. Standard : coffret pour débuter. Pro : l'expérience complète (pistolet à colle, tissu de finition, 5 designs exclusifs).","Wool Box: yarn balls. Standard: box to get started. Pro: the complete experience (glue gun, finishing fabric, 5 exclusive designs).","Wool Box: كبّات صوف. ستاندرد: صندوق للبداية. برو: التجربة المتكاملة (مسدس غراء، قماش للتشطيب، 5 تصاميم حصرية)."]],[["Comment commander ?","How do I order?","كيف أطلب؟"],["Clique sur « Commander sur WhatsApp » : un message est prêt, il te suffit de l'envoyer. Paiement à la livraison.","Click \"Order on WhatsApp\": a message is ready, just send it. Cash on delivery.","اضغطي على «اطلبي عبر واتساب»: الرسالة جاهزة، يكفي إرسالها. الدفع عند الاستلام."]],[["Y a-t-il une formation ?","Is there training?","هل هناك تكوين؟"],["Oui. Après ta commande, Nouhaila t'envoie la formation et te suit jusqu'à ce que tu apprennes.","Yes. After your order, Nouhaila sends you the training and follows up until you've learned.","نعم. بعد طلبك، ترسل لك نهيلة التكوين وتتابع معك حتى تتعلمي."]],[["Faites-vous du sur-mesure ?","Do you make custom pieces?","هل تقومون بالطلبات الخاصة؟"],["Oui, commande personnalisée sur WhatsApp.","Yes, custom orders on WhatsApp.","نعم، طلب خاص عبر واتساب."]],[["Où livrez-vous ? Délai ?","Where do you deliver? How long?","أين توصلون؟ وما المدة؟"],["Partout au Maroc, livraison gratuite pour les packs Standard et Pro. Délai à confirmer.","Across Morocco, free delivery for the Standard and Pro packs. Delivery time to be confirmed.","لجميع مدن المغرب، التوصيل مجاني لباقتي ستاندرد وبرو. المدة ستحدد لاحقا."]]];return `<section><h1>FAQ</h1>${F.map(a=>`<details><summary>${X(a[0])}</summary><p>${X(a[1])}</p></details>`).join("")}</section>`},
contact:()=>`<section><h1>Contact</h1><p>${tr("Clique : un message est prêt pour me dire si tu viens pour une commande personnalisée, un Pack Pro, un Kit Standard ou une Wool Box.","Click: a message is ready to tell me if you're here for a custom order, a Pro Pack, a Standard Kit or a Wool Box.","اضغطي: رسالة جاهزة لتخبريني إن كنت تريدين طلبا خاصا أو باك برو أو كيت ستاندرد أو Wool Box.")}</p><a class="btn g" target="_blank" rel="noopener" href="${wl(GM())}">WhatsApp</a> <a class="btn o" target="_blank" rel="noopener" href="https://instagram.com/nouhailacreates">Instagram</a></section>`};
function prod(id){const p=P.find(x=>x.id==id);if(!p)return V.shop();return `<section><a href="#shop" class="mut">← ${tr("Nos packs","Our packs","الباكات")}</a><div class="pd" style="margin-top:12px"><div><img class="main" id="mi" src="${IM[p.imgs[0]]}" alt="${p.name[0]}"><div class="th">${p.imgs.map(k=>`<img src="${IM[k]}" alt="${p.name[0]}" onclick="mi.src=this.src">`).join("")}</div></div><div><span class="tag">${X(p.sub)}</span><h1>${X(p.name)}</h1><div class="price" style="font-size:1.4rem">${pr(p)}</div><p>${X(p.desc)}</p>${p.perks?`<ul class="pk">${X(p.perks).map(a=>`<li>${a}</li>`).join("")}</ul>`:""}<p><b>${tr("Dans la boîte :","In the box:","محتويات الباقة:")}</b> ${X(p.inc)}</p><p><b>${tr("Pour qui :","Who it's for:","لمن:")}</b> ${X(p.who)}</p>${p.colors?`<p><b>${tr("Choisis tes couleurs de laine :","Choose your yarn colours:","اختاري ألوان الصوف الخاصة بك:")}</b> ${tr("dis-moi tes couleurs préférées sur WhatsApp et personnalise ton pack à ton goût.","tell me your favourite colours on WhatsApp and customise your pack to your taste.","قولي لي ألوانك المفضلة عبر واتساب وخصصي باقتك حسب ذوقك.")}</p>`:""}${p.free?`<p><b>${tr("Livraison gratuite partout au Maroc.","Free delivery across Morocco.","التوصيل مجاني إلى جميع أنحاء المغرب.")}</b></p>`:""}<a class="btn g" target="_blank" rel="noopener" href="${om(p)}">${tr("Commander sur WhatsApp","Order on WhatsApp","اطلبي عبر واتساب")}</a></div></div></section>`}
function route(){const h=location.hash.slice(1)||"home",[r,a]=h.split("/");$("#app").innerHTML=r=="p"?prod(a):(V[r]||V.home)();scrollTo(0,0)}
function lang(l){L=l;document.documentElement.lang=l;document.documentElement.dir=l=="ar"?"rtl":"ltr";$("#bar").textContent=t("bar");const k=["home","shop","learn","learn","story","faq","contact"];$("#nav").innerHTML=X(NAV).map((n,i)=>`<a href="#${k[i]}">${n}</a>`).join("");
$("footer .w").innerHTML=`<div><b>Nouhaila Creates</b><br>Create your own little world.<br>nouhailacreates.store</div><div><a href="#shop">${tr("Nos packs","Our packs","الباكات")}</a><a href="#faq">FAQ</a><a href="#contact">Contact</a><a href="#story">${tr("Notre histoire","Our story","قصتنا")}</a></div><div><a href="https://instagram.com/nouhailacreates" target="_blank" rel="noopener">Instagram @nouhailacreates</a><a id="wa2" target="_blank" rel="noopener">WhatsApp</a></div><div><a href="#faq">${tr("Livraison","Delivery","التوصيل")}</a></div>`;
$("#wa2").href=wl(GM());$("#wab").href=wl(GM());$(".logo").innerHTML=LG(46)+"<span>Nouhaila Creates</span>";route()}
$("#lang").onchange=e=>lang(e.target.value);addEventListener("hashchange",route);lang("fr");
</script></body></html>
